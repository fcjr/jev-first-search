<style>
  :root {
    --ground: #f2f5f8;

    --s-star: #eda100;
    color-scheme: light;
  }
  body { background: var(--ground); color: var(--ink); font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; padding-block: 32px; padding-inline: 16px; margin: 0; font-variant-numeric: tabular-nums; }
  body.frame { padding: 0; overflow: hidden; }
  .page { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .frame .page { max-width: none; gap: 0; }
  .lede { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  h1 { font-size: 40px; font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0; max-width: 22ch; text-wrap: balance; font-variation-settings: "opsz" 96; }
  .caption, .intro { color: var(--muted); max-width: 64ch; line-height: 1.5; margin: 0; font-size: 15px; }
  .caption code, .intro code { font-family: "Spline Sans Mono", ui-monospace, monospace; font-size: .9em; background: var(--card); padding: 1px 6px; border: 1px solid var(--dot); border-radius: 4px; }
  button { font: 600 14px "Bricolage Grotesque", sans-serif; color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button:hover { background: var(--hl); }
  button:focus-visible { outline: 3px solid var(--s-bfs); outline-offset: 2px; }
  .frame .lede, .frame .intro, .frame .fig-wrap:not(.only), .frame .table-wrap, .frame h2 { display: none; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 8px 0 0; }
  .fig-wrap { width: 100%; min-width: 0; overflow: hidden; }
  .stage {
    width: 1200px; height: 676px; transform-origin: top left; box-sizing: border-box;
    background: radial-gradient(var(--dot) 1px, transparent 1.4px) 0 0 / 20px 20px, var(--ground);
    border: 1.5px solid var(--line);
    overflow: hidden;
  }
  .frame .stage { border: 0; }
  .stage { display: grid; grid-template-rows: auto 1fr auto; padding: 22px 28px 18px; gap: 8px; position: relative; }
  .fig-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .fig-title { font-size: 30px; font-weight: 800; margin: 0; letter-spacing: -0.02em; font-variation-settings: "opsz" 96; }
  .fig-sub { color: var(--muted); font-size: 16px; margin: 4px 0 0; max-width: 72ch; line-height: 1.4; }
  .fig-repo { text-align: right; line-height: 1.15; white-space: nowrap; padding-top: 6px; }
  .fig-repo b { display: block; font-weight: 700; font-size: 15px; }
  .fig-repo span { font-size: 12px; color: var(--muted); }
  .fig-body { min-height: 0; }
  .fig-body svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .fig-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); border-top: 1.5px solid var(--ink); padding-top: 8px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--ink); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }

  svg text { font-family: "Bricolage Grotesque", sans-serif; font-size: 12.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  svg .axis line, svg .axis path { stroke: var(--line); stroke-width: 1; fill: none; }
  svg .axis.base path { stroke: var(--ink); stroke-width: 1.5; }
  svg .gridline { stroke: var(--dot); stroke-width: 1; }
  svg .series { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  svg .dot { stroke: var(--ground); stroke-width: 2; }
  svg .dlabel { font-weight: 700; fill: var(--ink); font-size: 13px; }
  svg .annot { fill: var(--ink); font-size: 13.5px; }
  svg .annot.big { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  svg .axis-title { fill: var(--muted); font-size: 12.5px; }
  svg .frontier { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 5; }
  svg .hit { fill: transparent; cursor: default; }

  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--ground); font: 12.5px/1.4 "Bricolage Grotesque", sans-serif; padding: 6px 9px; border-radius: 4px; white-space: pre; opacity: 0; transition: opacity .1s; z-index: 10; }
  #tip.on { opacity: 1; }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 13.5px; min-width: 700px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--dot); }
  th { color: var(--muted); font-weight: 500; }
  td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align: left; }
</style>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  if (params.has('frame')) document.body.classList.add('frame');
  const BENCH = JSON.parse(document.getElementById('bench').textContent || '{}');
  const figs = document.getElementById('figs');
  if (!BENCH.summary) {
    figs.innerHTML = '<p class="intro">No benchmark recorded yet. Run <code>npm run media:bench</code> (or <code>media:bench:mock</code>).</p>';
    return;
  }

  const ALGOS = [
    { key:'bfs', name:'Breadth-first', short:'BFS', color:'var(--s-bfs)' },
    { key:'dfs', name:'Depth-first', short:'DFS', color:'var(--s-dfs)' },
    { key:'jfs', name:'Jev-first', short:'Jev-first', color:'var(--s-jfs)' },
    { key:'star', name:'Jev*', short:'Jev*', color:'var(--s-star)' },
  ];
  const SIZES = BENCH.sizes;
  const S = (algo, size) => BENCH.summary.find(s => s.algo === algo && s.size === size);
  const Q = (algo, size) => mean(BENCH.runs.filter(r => r.algo === algo && r.size === size).map(r => r.found ? r.optimality : 0));
  const runsOf = (algo) => BENCH.runs.filter(r => r.algo === algo);
  const mean = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
  const overall = Object.fromEntries(ALGOS.map(a => {
    const rs = runsOf(a.key);
    const found = rs.filter(r => r.found);
    return [a.key, {
      costUsd: mean(rs.map(r => r.costUsd)),
      elapsedMs: mean(rs.map(r => r.elapsedMs)),
      optimality: mean(rs.map(r => r.found ? r.optimality : 0)),
      successRate: mean(rs.map(r => r.found ? 1 : 0)),
      jevCalls: mean(rs.map(r => r.jevCalls)),
    }];
  }));
  const usd = (v, d = 7) => v === 0 ? '$0' : `$${v.toFixed(d)}`;
  const usdM = (v) => v === 0 ? '$0' : v >= 100 ? `$${Math.round(v).toLocaleString()}` : `$${v.toFixed(2)}`;
  const pct = (v) => `${Math.round(v * 100)}%`;
  const fmtMs = (ms) => ms < 0.001 ? `${(ms * 1e6).toFixed(0)} ns` : ms < 1 ? `${(ms * 1000).toFixed(0)} µs` : ms < 1000 ? `${ms.toFixed(0)} ms` : `${(ms / 1000).toFixed(1)} s`;
  const when = new Date(BENCH.recordedAt).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  const source = `${BENCH.iters} random graphs per size, ${BENCH.mock ? 'mock client' : BENCH.model}, recorded ${when}`;

  document.getElementById('intro').innerHTML =
    `Each of the four searches ran on the same random connected graphs: ${SIZES.join(', ')} nodes, ${BENCH.iters} graphs each, start at <code>n0</code>, goal at least three edges away. ` +
    (BENCH.mock ? 'These numbers come from the mock client, not from Jev.' : `Jev-first and Jev* made real requests to <code>${BENCH.model}</code>. Cost is input tokens at $0.042 per million; output is free.`);

  // ---- helpers ----
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };
  const tip = document.getElementById('tip');
  function hover(target, text) {
    target.addEventListener('mousemove', (e) => { tip.textContent = text; tip.classList.add('on'); tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`; });
    target.addEventListener('mouseleave', () => tip.classList.remove('on'));
  }
  const logScale = (lo, hi, a, b) => (v) => a + (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * (b - a);
  const linScale = (lo, hi, a, b) => (v) => a + (v - lo) / (hi - lo) * (b - a);
  const pow10 = (e) => e < 0 ? `10⁻${String(-e).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}` : e === 0 ? '1' : `10${String(e).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}`;

  function stage(id, title, sub, legendAlgos, note) {
    const wrap = document.createElement('section');
    wrap.className = 'fig-wrap';
    wrap.dataset.fig = id;
    wrap.innerHTML = `
      <div class="stage">
        <div class="fig-head"><div><h3 class="fig-title">${title}</h3><p class="fig-sub">${sub}</p></div><div class="fig-repo"><b>jev-first-search</b><span>github.com/fcjr/jev-first-search</span></div></div>
        <div class="fig-body"></div>
        <div class="fig-foot"><div class="legend">${legendAlgos.map(a => `<span><i style="background:${a.color}"></i>${a.name}</span>`).join('')}</div><div class="note">${note ?? source}</div></div>
      </div>`;
    figs.appendChild(wrap);
    const svg = el('svg', { viewBox: '0 0 1144 470', preserveAspectRatio: 'xMidYMid meet' });
    wrap.querySelector('.fig-body').appendChild(svg);
    return svg;
  }
  function yAxis(svg, x0, x1, ticks, y, fmt, title) {
    const g = el('g', { class: 'axis' });
    for (const t of ticks) {
      g.appendChild(el('line', { class: 'gridline', x1: x0, x2: x1, y1: y(t), y2: y(t) }));
      g.appendChild(el('text', { x: x0 - 10, y: y(t) + 4, 'text-anchor': 'end' }, fmt(t)));
    }
    if (title) g.appendChild(el('text', { class: 'axis-title', x: 0, y: 12 }, title));
    svg.appendChild(g);
  }
  function xAxisSizes(svg, x, y0, x0, x1) {
    const g = el('g', { class: 'axis base' });
    g.appendChild(el('path', { d: `M${x0},${y0}H${x1}` }));
    for (const s of SIZES) g.appendChild(el('text', { x: x(s), y: y0 + 22, 'text-anchor': 'middle' }, `${s}`));
    g.appendChild(el('text', { class: 'axis-title', x: x1, y: y0 + 42, 'text-anchor': 'end' }, 'nodes in graph'));
    svg.appendChild(g);
  }
  function line(svg, pts, color, label, tipFn) {
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x},${p.y}`).join('');
    svg.appendChild(el('path', { class: 'series', d, stroke: color }));
    for (const p of pts) {
      const c = el('circle', { class: 'dot', cx: p.x, cy: p.y, r: 5, fill: color });
      svg.appendChild(c);
      const hit = el('circle', { class: 'hit', cx: p.x, cy: p.y, r: 14 });
      hover(hit, tipFn(p));
      svg.appendChild(hit);
    }
    const last = pts[pts.length - 1];
    svg.appendChild(el('text', { class: 'dlabel', x: last.x + 12, y: last.y + 4 }, label));
  }

  // ---- fig 1: time ----
  {
    const svg = stage('time', 'Time to find a path', 'Mean wall-clock time per search. BFS and DFS are measured in this benchmark run. Jev-first and Jev* include the round trips to Jev.', ALGOS);
    const L = 84, R = 990, T = 24, B = 410;
    const allMs = BENCH.summary.map(s => s.elapsedMs).filter(v => v > 0);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...allMs)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...allMs))));
    const y = logScale(lo, hi, B, T);
    const x = logScale(SIZES[0], SIZES[SIZES.length - 1], L, R);
    const ticks = []; for (let e = Math.log10(lo); e <= Math.log10(hi); e++) ticks.push(Math.pow(10, e));
    yAxis(svg, L, R, ticks, y, fmtMs, 'time per search');
    xAxisSizes(svg, x, B, L, R);
    // labels collide at the right edge when two series are close; nudge them apart
    const ends = ALGOS.map(a => ({ a, yv: y(S(a.key, SIZES[SIZES.length - 1]).elapsedMs) })).sort((p, q) => p.yv - q.yv);
    for (let i = 1; i < ends.length; i++) if (ends[i].yv - ends[i-1].yv < 16) ends[i].yv = ends[i-1].yv + 16;
    for (const a of ALGOS) {
      const pts = SIZES.map(s => ({ x: x(s), y: y(S(a.key, s).elapsedMs), size: s, ms: S(a.key, s).elapsedMs }));
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x},${p.y}`).join('');
      svg.appendChild(el('path', { class: 'series', d, stroke: a.color }));
      for (const p of pts) {
        svg.appendChild(el('circle', { class: 'dot', cx: p.x, cy: p.y, r: 5, fill: a.color }));
        const hit = el('circle', { class: 'hit', cx: p.x, cy: p.y, r: 14 });
        hover(hit, `${a.name}, ${p.size} nodes\n${fmtMs(p.ms)} per search`);
        svg.appendChild(hit);
      }
      const e = ends.find(q => q.a === a);
      svg.appendChild(el('text', { class: 'dlabel', x: R + 12, y: e.yv + 4 }, `${a.short} ${fmtMs(pts[pts.length - 1].ms)}`));
    }
    const big = SIZES[SIZES.length - 1];
    const ratio = S('jfs', big).elapsedMs / S('bfs', big).elapsedMs;
    const rtxt = ratio >= 1e6 ? `${(ratio / 1e6).toFixed(1)} million×` : `${Math.round(ratio).toLocaleString()}×`;
    svg.appendChild(el('text', { class: 'annot big', x: L + 16, y: (T + B) / 2 - 6 }, `${rtxt} slower.`));
    svg.appendChild(el('text', { class: 'annot', x: L + 16, y: (T + B) / 2 + 18 }, `Jev-first vs. breadth-first on ${big} nodes. Linear in the number of nodes. So is the invoice.`));
  }

  // ---- fig 2: the frontier ----
  {
    const svg = stage('frontier', 'Cost against quality', 'Mean cost per search against path quality: optimal length ÷ found length, and 0 when the search gave up. Every model on this chart is on the Pareto frontier if you squint.', ALGOS, `${source}. Cost is input tokens at $0.042 per million.`);
    const L = 84, R = 1000, T = 24, B = 410;
    const ZERO_X = L + 60, LOG_X0 = L + 150;
    const costs = ALGOS.map(a => overall[a.key].costUsd).filter(c => c > 0);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...costs)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...costs))));
    const xlog = logScale(lo, hi, LOG_X0, R);
    const x = (c) => c === 0 ? ZERO_X : xlog(c);
    const y = linScale(0, 1, B, T);
    yAxis(svg, L, R, [0, 0.25, 0.5, 0.75, 1], y, pct, 'path quality');
    const ax = el('g', { class: 'axis base' });
    ax.appendChild(el('path', { d: `M${L},${B}H${R}` }));
    ax.appendChild(el('text', { x: ZERO_X, y: B + 22, 'text-anchor': 'middle' }, '$0'));
    // axis break
    ax.appendChild(el('path', { class: 'frontier', d: `M${LOG_X0 - 30},${B - 6}l6,12` , 'stroke-dasharray': 'none' }));
    ax.appendChild(el('path', { class: 'frontier', d: `M${LOG_X0 - 22},${B - 6}l6,12`, 'stroke-dasharray': 'none' }));
    for (let e = Math.log10(lo); e <= Math.log10(hi); e++) { const v = Math.pow(10, e); ax.appendChild(el('text', { x: xlog(v), y: B + 22, 'text-anchor': 'middle' }, `$${v.toFixed(Math.max(0, -e))}`)); }
    ax.appendChild(el('text', { class: 'axis-title', x: R, y: B + 42, 'text-anchor': 'end' }, 'cost per search (log)'));
    svg.appendChild(ax);
    // frontier: cheapest for each quality level, i.e. the $0 column
    const best = ALGOS.map(a => overall[a.key]).filter(o => o.costUsd === 0).sort((p, q) => q.optimality - p.optimality)[0];
    svg.appendChild(el('path', { class: 'frontier', d: `M${ZERO_X},${T}V${y(best.optimality)}H${R}` }));
    svg.appendChild(el('text', { class: 'annot', x: R - 4, y: y(best.optimality) - 8, 'text-anchor': 'end' }, 'the frontier'));
    // per-size faint points, then the mean
    for (const a of ALGOS) {
      for (const s of SIZES) {
        const st = S(a.key, s);
        svg.appendChild(el('circle', { cx: x(st.costUsd) + (st.costUsd === 0 ? (a.key === 'dfs' ? 10 : -10) : 0), cy: y(st.optimality), r: 4, fill: a.color, opacity: 0.35 }));
      }
    }
    const placed = [];
    for (const a of ALGOS) {
      const o = overall[a.key];
      const cx = x(o.costUsd) + (o.costUsd === 0 ? (a.key === 'dfs' ? 10 : -10) : 0), cy = y(o.optimality);
      const c = el('circle', { class: 'dot', cx, cy, r: 9, fill: a.color });
      svg.appendChild(c);
      const hit = el('circle', { class: 'hit', cx, cy, r: 18 });
      hover(hit, `${a.name}\n${usd(o.costUsd)} per search, ${pct(o.optimality)} quality\n${pct(o.successRate)} found, ${o.jevCalls.toFixed(1)} requests`);
      svg.appendChild(hit);
      let ly = cy < T + 40 ? cy + 30 : cy - 16;
      while (placed.some(p => Math.abs(p.x - cx) < 160 && Math.abs(p.y - ly) < 18)) ly += cy < T + 40 ? 18 : -18;
      placed.push({ x: cx, y: ly });
      svg.appendChild(el('text', { class: 'dlabel', x: cx, y: ly, 'text-anchor': 'middle' }, `${a.short}: ${usd(o.costUsd, 6)}, ${pct(o.optimality)}`));
    }
  }

  // ---- fig 3: pricing ----
  {
    const svg = stage('pricing', 'What a million searches costs', 'Mean over all graph sizes. Input tokens at $0.042 per million. Output tokens are free, which helps.', ALGOS, `${source}.`);
    const L = 180, R = 1000, T = 40, B = 400;
    const rows = ALGOS.map(a => ({ a, v: overall[a.key].costUsd * 1e6 }));
    const max = Math.max(...rows.map(r => r.v));
    const x = linScale(0, max * 1.15, L, R);
    const rowH = (B - T) / rows.length;
    svg.appendChild(el('path', { class: 'frontier', d: `M${L},${T - 10}V${B + 10}`, 'stroke-dasharray': 'none', stroke: 'var(--ink)' }));
    rows.forEach((r, i) => {
      const yc = T + rowH * i + rowH / 2, h = 34;
      svg.appendChild(el('text', { class: 'dlabel', x: L - 14, y: yc + 5, 'text-anchor': 'end' }, r.a.name));
      if (r.v === 0) {
        svg.appendChild(el('text', { class: 'annot', x: L + 12, y: yc + 5 }, 'Free. No API key, no probabilities.'));
      } else {
        const w = Math.max(6, x(r.v) - L);
        const bar = el('rect', { x: L, y: yc - h / 2, width: w, height: h, fill: r.a.color, rx: 4 });
        svg.appendChild(el('rect', { x: L, y: yc - h / 2, width: 4, height: h, fill: r.a.color }));
        svg.appendChild(bar);
        hover(bar, `${r.a.name}\n${usdM(r.v)} per million searches\n${overall[r.a.key].jevCalls.toFixed(1)} requests per search`);
        svg.appendChild(el('text', { class: 'dlabel', x: L + w + 12, y: yc + 5 }, `${usdM(r.v)} per million`));
      }
    });
    const jfs = rows.find(r => r.a.key === 'jfs').v;
    svg.appendChild(el('text', { class: 'annot big', x: L, y: B + 52 }, `${usdM(jfs)} to search a million graphs.`));
    svg.appendChild(el('text', { class: 'annot', x: L, y: B + 76 }, `That is ${usdM(jfs)} more than the alternative, and the alternative was already installed.`));
  }

  // ---- fig 4: probably ----
  {
    const jevAlgos = ALGOS.filter(a => a.key === 'jfs' || a.key === 'star');
    const svg = stage('probably', 'How sure Jev was', 'The probability of each result is the product of Jev\'s confidence at every step. One dot per graph. It goes to zero as the graph grows. The paths are still there.', jevAlgos);
    const L = 84, R = 990, T = 24, B = 410;
    const x = logScale(SIZES[0], SIZES[SIZES.length - 1], L, R);
    const probs = BENCH.runs.filter(r => (r.algo === 'jfs' || r.algo === 'star') && r.found && r.probability > 0).map(r => r.probability);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...probs, 0.1))));
    const y = logScale(lo, 1, B, T);
    const ticks = []; for (let e = Math.log10(lo); e <= 0; e++) ticks.push(Math.pow(10, e));
    yAxis(svg, L, R, ticks, y, (v) => pow10(Math.round(Math.log10(v))), 'probability (log)');
    xAxisSizes(svg, x, B, L, R);
    const ends = [];
    for (const a of jevAlgos) {
      const off = a.key === 'jfs' ? -7 : 7;
      for (const r of runsOf(a.key)) if (r.found && r.probability > 0) {
        const c = el('circle', { class: 'dot', cx: x(r.size) + off, cy: y(Math.max(r.probability, lo)), r: 6, fill: a.color, opacity: 0.85 });
        hover(c, `${a.name}, ${r.size} nodes, graph ${r.iter + 1}\nprobability ${r.probability.toExponential(2)}\npath ${r.pathLength} edges, optimal ${r.optimal}`);
        svg.appendChild(c);
      }
      const pts = SIZES.map(s => { const rs = runsOf(a.key).filter(r => r.size === s && r.found && r.probability > 0); const gm = rs.length ? Math.exp(mean(rs.map(r => Math.log(r.probability)))) : null; return gm ? { x: x(s) + off, y: y(Math.max(gm, lo)), gm } : null; }).filter(Boolean);
      svg.appendChild(el('path', { class: 'series', d: pts.map((p, i) => `${i ? 'L' : 'M'}${p.x},${p.y}`).join(''), stroke: a.color, opacity: 0.6 }));
      ends.push({ a, y: pts[pts.length - 1].y, gm: pts[pts.length - 1].gm });
    }
    ends.sort((p, q) => p.y - q.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i-1].y < 16) ends[i].y = ends[i-1].y + 16;
    for (const e of ends) svg.appendChild(el('text', { class: 'dlabel', x: R + 12, y: e.y + 4 }, `${e.a.short} ${e.gm >= 0.01 ? e.gm.toFixed(2) : e.gm.toExponential(1)}`));
    const found = BENCH.runs.filter(r => r.algo === 'jfs');
    svg.appendChild(el('text', { class: 'annot big', x: L + 16, y: B - 78 }, `Jev-first found ${found.filter(r => r.found).length} of ${found.length} paths. Jev* found all ${found.length}.`));
    svg.appendChild(el('text', { class: 'annot', x: L + 16, y: B - 54 }, `Mean stated probability that a Jev-first path is right: ${mean(found.map(r => r.probability ?? 0)).toFixed(2)}. Lines show the geometric mean.`));
  }

  // ---- fig 5: quality by size ----
  {
    const svg = stage('quality', 'Path quality as graphs grow', 'Optimal length ÷ found length, and 0 when the search gave up. Breadth-first is 100% by definition. Jev* is dashed because it sits exactly on top of it.', ALGOS);
    const L = 84, R = 990, T = 24, B = 410;
    const x = logScale(SIZES[0], SIZES[SIZES.length - 1], L, R);
    const y = linScale(0, 1, B, T);
    yAxis(svg, L, R, [0, 0.25, 0.5, 0.75, 1], y, pct, 'path quality');
    xAxisSizes(svg, x, B, L, R);
    const ends = ALGOS.map(a => ({ a, yv: y(Q(a.key, SIZES[SIZES.length - 1])) })).sort((p, q) => p.yv - q.yv);
    for (let i = 1; i < ends.length; i++) if (ends[i].yv - ends[i-1].yv < 16) ends[i].yv = ends[i-1].yv + 16;
    for (const a of ALGOS) {
      const pts = SIZES.map(s => ({ x: x(s), y: y(Q(a.key, s)), size: s, st: S(a.key, s), q: Q(a.key, s) }));
      svg.appendChild(el('path', { class: 'series', d: pts.map((p, i) => `${i ? 'L' : 'M'}${p.x},${p.y}`).join(''), stroke: a.color, ...(a.key === 'star' ? { 'stroke-dasharray': '10 8' } : {}) }));
      for (const p of pts) {
        svg.appendChild(el('circle', { class: 'dot', cx: p.x, cy: p.y, r: 5, fill: a.color }));
        const hit = el('circle', { class: 'hit', cx: p.x, cy: p.y, r: 14 });
        hover(hit, `${a.name}, ${p.size} nodes\n${pct(p.q)} quality, ${pct(p.st.successRate)} found\n${p.st.visited.toFixed(1)} nodes visited`);
        svg.appendChild(hit);
      }
      const e = ends.find(q => q.a === a);
      svg.appendChild(el('text', { class: 'dlabel', x: R + 12, y: e.yv + 4 }, `${a.short} ${pct(pts[pts.length - 1].q)}`));
    }
  }

  // ---- table ----
  {
    const t = document.getElementById('table');
    t.innerHTML = `<thead><tr><th>nodes</th><th>search</th><th>found</th><th>quality</th><th>visited</th><th>requests</th><th>time</th><th>cost / search</th><th>probability</th></tr></thead><tbody>` +
      BENCH.summary.map(s => { const a = ALGOS.find(a => a.key === s.algo); return `<tr><td>${s.size}</td><td>${a.name}</td><td>${pct(s.successRate)}</td><td>${pct(Q(s.algo, s.size))}</td><td>${s.visited.toFixed(1)}</td><td>${s.jevCalls.toFixed(1)}</td><td>${fmtMs(s.elapsedMs)}</td><td>${usd(s.costUsd)}</td><td>${s.jevCalls ? s.probability.toExponential(1) : '—'}</td></tr>`; }).join('') + '</tbody>';
  }

  // ---- fit stages to the page width; frame mode shows one figure ----
  window.__FIGS__ = [...figs.querySelectorAll('.fig-wrap')].map(w => w.dataset.fig);
  window.__showFig = (id) => { for (const w of figs.querySelectorAll('.fig-wrap')) w.classList.toggle('only', w.dataset.fig === id); };
  if (params.has('fig')) window.__showFig(params.get('fig'));
  function fit() {
    for (const w of figs.querySelectorAll('.fig-wrap')) {
      const st = w.querySelector('.stage');
      if (document.body.classList.contains('frame')) { st.style.transform = ''; w.style.height = '676px'; continue; }
      if (!w.clientWidth) continue;
      const s = Math.min(1, w.clientWidth / 1200);
      st.style.transform = `scale(${s})`;
      w.style.height = `${676 * s}px`;
    }
  }
  window.addEventListener('resize', fit);
  fit();
  document.fonts?.ready.then(fit);
})();
</script>
