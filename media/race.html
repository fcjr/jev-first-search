<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --paper: #faf7ee;
    --grid: #cfdde8;
    --ink: #1f2a33;
    --pencil: #8f9aa3;
    --blue: #2456c8;
    --blue-soft: #d9e3fa;
    --red: #d63b2f;
    --yellow: #f5d547;
    --muted: #5d6a74;
    --white: #ffffff;
    color-scheme: light;
  }
  body { background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; padding-block: 32px; padding-inline: 16px; margin: 0; }
  body.frame { padding: 0; overflow: hidden; }
  .page { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
  .frame .page { max-width: none; gap: 0; }
  .lede { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
  .frame .lede, .frame .caption { display: none; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 34px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h1 em { font-style: italic; color: var(--red); }
  .caption { color: var(--muted); max-width: 70ch; line-height: 1.5; margin: 0; }
  .caption code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.92em; background: var(--white); padding: 1px 6px; border: 1px solid var(--grid); border-radius: 4px; }
  button { font: 500 14px "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); background: var(--white); border: 1.5px solid var(--ink); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: var(--yellow); }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .stage-wrap { width: 100%; }
  .stage {
    width: 1200px; height: 676px; transform-origin: top left; box-sizing: border-box;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--paper);
    border: 1.5px solid var(--ink);
    display: grid; grid-template-rows: 62px 1fr 72px; padding: 0 28px; overflow: hidden;
  }
  .frame .stage { border: 0; }
  .stage-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid var(--ink); }
  .stage-head .q { font-family: "Fraunces", Georgia, serif; font-size: 26px; font-weight: 600; }
  .stage-head .q em { color: var(--red); font-style: italic; }
  .stage-head .repo { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; color: var(--muted); }
  .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; padding-top: 12px; align-content: start; }
  .col { display: grid; grid-template-rows: auto auto auto; gap: 4px; min-width: 0; }
  .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .col-head .name { font-family: "Fraunces", Georgia, serif; font-size: 21px; font-weight: 600; white-space: nowrap; }
  .chip { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; padding: 2px 8px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--white); white-space: nowrap; }
  .chip.jev { background: var(--yellow); }
  svg { width: 100%; height: auto; display: block; }
  .edge { stroke: var(--pencil); stroke-width: 2; fill: none; }
  .edge.path { stroke: var(--red); stroke-width: 5; stroke-linecap: round; }
  .node circle { fill: var(--white); stroke: var(--ink); stroke-width: 2; }
  .node.frontier circle { fill: var(--blue-soft); stroke: var(--blue); }
  .node.visited circle { fill: var(--ink); stroke: var(--ink); }
  .node.current circle { fill: var(--yellow); stroke: var(--ink); stroke-width: 3; }
  .node.onpath circle { fill: var(--red); stroke: var(--red); }
  .node text.label { font: 600 15px "IBM Plex Mono", ui-monospace, monospace; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .node.visited text.label, .node.onpath text.label { fill: var(--paper); }
  .node.current text.label { fill: var(--ink); }
  .node text.h { font: 500 11px "IBM Plex Mono", ui-monospace, monospace; fill: var(--blue); text-anchor: middle; }
  .node.visited text.h, .node.onpath text.h { fill: var(--muted); }
  .ring { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .status { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; min-height: 40px; display: grid; align-content: start; gap: 3px; }
  .status .line { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); animation: pulse 0.9s ease-in-out infinite; }
  .status .bar { flex: none; display: inline-block; width: 60px; height: 8px; border: 1px solid var(--ink); background: var(--white); position: relative; }
  .status .bar i { position: absolute; inset: 0; right: auto; background: var(--red); }
  .status .dim { color: var(--muted); }
  .status .done { color: var(--red); font-weight: 600; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(.7);} }
  .stage-foot { border-top: 1.5px solid var(--ink); display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; align-items: center; }
  .tally { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-variant-numeric: tabular-nums; }
  .tally b { font-weight: 600; }
  .tally .cost { color: var(--red); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .status .dot { animation: none; } }
</style>

  const params = new URLSearchParams(location.search);
  const FRAME_T = params.has('t') ? Number(params.get('t')) : null;
  if (params.has('frame')) document.body.classList.add('frame');

  const T = JSON.parse(document.getElementById('traces').textContent || '{}');
  if (!T.race) {
    document.getElementById('cols').innerHTML = '<p style="font-family:IBM Plex Mono,monospace">No traces recorded yet. Run <b>npm run media:record</b> (or <b>media:record:mock</b>).</p>';
    return;
  }
  const R = T.race;
  const ADJ = R.graph, START = R.start, GOAL = R.goal;
  const NODES = Object.keys(ADJ);
  const KNOWN = { A:[36,210], B:[116,96], C:[116,324], I:[196,30], D:[196,150], E:[196,270], J:[196,390], F:[276,96], G:[276,324], H:[336,210] };
  const POS = {};
  NODES.forEach((n, i) => {
    POS[n] = KNOWN[n] ?? [186 + 160 * Math.cos((2 * Math.PI * i) / NODES.length), 210 + 170 * Math.sin((2 * Math.PI * i) / NODES.length)];
  });
  const EDGES = [];
  for (const a in ADJ) for (const b of ADJ[a]) if (a < b) EDGES.push([a, b]);
  const USD_PER_TOKEN = 0.042 / 1e6;

  document.getElementById('question').innerHTML = `Find a path from <em>${START}</em> to <em>${GOAL}</em>`;
  document.getElementById('caption').innerHTML =
    `Breadth-first uses a queue. Depth-first uses a stack. Jev-first asks <code>${T.model ?? 'jev-latest'}</code> which frontier node to visit next, one request per node, and offers it <code>give_up</code> every time. Jev* is A* where the heuristic is a Jev <code>score</code> question, one request per node discovered. ` +
    (T.mock ? 'These Jev answers are from the mock client, not the API.' : `The Jev answers and latencies are real, recorded ${new Date(T.recordedAt).toLocaleDateString()}. BFS and DFS timings are measured live in your browser.`);

  // ---- classic searches, computed and timed here ----
  function bfs() {
    const parent = new Map([[START, null]]);
    const queue = [START];
    const steps = [];
    while (queue.length) {
      const v = queue.shift();
      if (v !== GOAL) for (const n of ADJ[v]) if (!parent.has(n)) { parent.set(n, v); queue.push(n); }
      steps.push({ picked: v, after: [...queue] });
      if (v === GOAL) break;
    }
    return { steps, parent };
  }
  function dfs() {
    const parent = new Map([[START, null]]);
    const stack = [START];
    const seen = new Set();
    const steps = [];
    while (stack.length) {
      const v = stack.pop();
      if (seen.has(v)) continue;
      seen.add(v);
      if (v !== GOAL) for (const n of ADJ[v]) if (!seen.has(n)) { if (!parent.has(n)) parent.set(n, v); stack.push(n); }
      steps.push({ picked: v, after: [...new Set(stack.filter(n => !seen.has(n)))] });
      if (v === GOAL) break;
    }
    return { steps, parent };
  }
  function pathOf(parent) {
    if (!parent.has(GOAL)) return null;
    const p = [];
    for (let c = GOAL; c !== null; c = parent.get(c)) p.unshift(c);
    return p;
  }
  function timeIt(fn) {
    const t0 = performance.now();
    let r;
    for (let i = 0; i < 200; i++) r = fn();
    return { result: r, ms: (performance.now() - t0) / 200 };
  }
  const B = timeIt(bfs), D = timeIt(dfs);

  // ---- jev-first: timeline from the recorded steps ----
  const T0 = 500, CLASSIC_STEP = 120, EXPAND_MS = 110;
  const jfsEvents = [];
  {
    let cursor = T0;
    const parent = new Map([[START, null]]);
    let frontier = [START];
    const perCall = R.jfs.jevCalls ? R.jfs.inputTokens / R.jfs.jevCalls : 0;
    for (const s of R.jfs.steps) {
      const ev = { ...s, begin: cursor, end: cursor + s.ms, tokens: perCall };
      if (s.type === 'visit') {
        ev.before = [...frontier];
        if (frontier.includes(s.picked)) {
          frontier = frontier.filter(n => n !== s.picked);
          if (s.picked !== GOAL) for (const n of ADJ[s.picked] ?? []) if (!parent.has(n)) { parent.set(n, s.picked); frontier.push(n); }
        }
        ev.after = [...frontier];
      }
      jfsEvents.push(ev);
      cursor = ev.end;
    }
    jfsEvents.done = cursor;
  }

  // ---- jev*: timeline from the recorded steps ----
  const starEvents = [];
  {
    let cursor = T0;
    const perCall = R.jevStar.jevCalls ? R.jevStar.inputTokens / R.jevStar.jevCalls : 0;
    for (const s of R.jevStar.steps) {
      const dur = s.type === 'heuristic' ? s.ms : EXPAND_MS;
      starEvents.push({ ...s, begin: cursor, end: cursor + dur, tokens: s.type === 'heuristic' ? perCall : 0 });
      cursor += dur;
    }
    starEvents.done = cursor;
  }

  const ALGOS = [
    { key:'bfs', name:'Breadth-first', chip:'queue', steps:B.result.steps, path:pathOf(B.result.parent), ms:B.ms },
    { key:'dfs', name:'Depth-first', chip:'stack', steps:D.result.steps, path:pathOf(D.result.parent), ms:D.ms },
    { key:'jfs', name:'Jev-first', chip:'jev', events:jfsEvents, result:R.jfs },
    { key:'star', name:'Jev*', chip:'jev + heap', events:starEvents, result:R.jevStar },
  ];
  const LOOP = Math.max(jfsEvents.done, starEvents.done, T0 + Math.max(B.result.steps.length, D.result.steps.length) * CLASSIC_STEP) + 2600;

  // ---- DOM ----
  const cols = document.getElementById('cols');
  const foot = document.getElementById('foot');
  const ui = {};
  for (const a of ALGOS) {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `
      <div class="col-head"><span class="name">${a.name}</span><span class="chip ${a.key === 'jfs' || a.key === 'star' ? 'jev' : ''}">${a.chip}</span></div>
      <svg viewBox="0 0 372 430" aria-label="${a.name} traversal">
        <g>${EDGES.map(([x,y]) => `<line class="edge" data-e="${x}${y}" x1="${POS[x][0]}" y1="${POS[x][1]}" x2="${POS[y][0]}" y2="${POS[y][1]}"/>`).join('')}</g>
        <g>${NODES.map(n => `<g class="node" data-n="${n}"><circle cx="${POS[n][0]}" cy="${POS[n][1]}" r="16"/>${n===GOAL?`<circle class="ring" cx="${POS[n][0]}" cy="${POS[n][1]}" r="22"/>`:''}<text class="label" x="${POS[n][0]}" y="${POS[n][1]}">${n}</text><text class="h" x="${POS[n][0]}" y="${POS[n][1] + 30}"></text></g>`).join('')}</g>
      </svg>
      <div class="status"></div>`;
    cols.appendChild(col);
    const tally = document.createElement('div');
    tally.className = 'tally';
    foot.appendChild(tally);
    ui[a.key] = {
      nodes: Object.fromEntries([...col.querySelectorAll('.node')].map(el => [el.dataset.n, el])),
      hs: Object.fromEntries([...col.querySelectorAll('.node')].map(el => [el.dataset.n, el.querySelector('text.h')])),
      edges: Object.fromEntries([...col.querySelectorAll('.edge')].map(el => [el.dataset.e, el])),
      status: col.querySelector('.status'),
      tally,
    };
  }

  const fmtMs = (ms) => ms < 1 ? `${ms.toFixed(3)} ms` : `${Math.round(ms).toLocaleString()} ms`;
  const fmtUsd = (usd) => `$${usd.toFixed(7)}`;
  const bar = (p) => `<span class="bar"><i style="width:${Math.round(Math.max(0, Math.min(1, p))*100)}%"></i></span>`;
  const arrows = (p) => p.join('→');

  function paint(u, visited, frontier, current, path, hs) {
    for (const n in u.nodes) {
      const onpath = path && path.includes(n);
      u.nodes[n].setAttribute('class', 'node' + (onpath ? ' onpath' : visited.has(n) ? ' visited' : frontier.has(n) ? ' frontier' : '') + (current === n && !path ? ' current' : ''));
      u.hs[n].textContent = hs && hs[n] !== undefined ? `h ${hs[n].toFixed(1)}` : '';
    }
    for (const e in u.edges) {
      const on = path && path.some((n, i) => i > 0 && (path[i-1] + n === e || n + path[i-1] === e));
      u.edges[e].setAttribute('class', 'edge' + (on ? ' path' : ''));
    }
  }
  function tally(u, visited, time, cost, calls) {
    u.tally.innerHTML = `<span>visited <b>${visited}</b></span><span>time <b>${time}</b></span><span>cost <b class="${calls ? 'cost' : ''}">${cost}</b></span><span>API calls <b>${calls}</b></span>`;
  }

  function renderClassic(a, t) {
    const u = ui[a.key];
    const k = t < T0 ? 0 : Math.min(a.steps.length, Math.floor((t - T0) / CLASSIC_STEP) + 1);
    const visited = new Set(a.steps.slice(0, k).map(s => s.picked));
    const frontier = new Set(k > 0 ? a.steps[k-1].after : [START]);
    const done = k === a.steps.length;
    paint(u, visited, frontier, k > 0 ? a.steps[k-1].picked : null, done ? a.path : null);
    u.status.innerHTML = k === 0
      ? `<div class="line dim">${a.chip}: [${START}]</div>`
      : done
        ? `<div class="line done">path found · ${arrows(a.path)}</div><div class="line dim">${a.chip} emptied. no questions asked.</div>`
        : `<div class="line">pop → <b>${a.steps[k-1].picked}</b></div><div class="line dim">${a.chip}: [${a.steps[k-1].after.join(', ')}]</div>`;
    tally(u, visited.size, done ? fmtMs(a.ms) : '—', '$0', 0);
  }

  function renderJfs(a, t) {
    const u = ui[a.key];
    const ev = a.events, res = a.result;
    const tt = Math.min(t, ev.done);
    const completed = ev.filter(e => e.end <= tt);
    const inFlight = ev.find(e => e.begin <= tt && tt < e.end);
    const visits = completed.filter(e => e.type === 'visit');
    const lastVisit = visits[visits.length - 1];
    const visited = new Set(visits.filter(e => e.before.includes(e.picked)).map(e => e.picked));
    const frontier = new Set(lastVisit ? lastVisit.after : [START]);
    const finished = tt >= ev.done;
    const found = finished && res.reason === 'found';
    paint(u, visited, frontier, lastVisit ? lastVisit.picked : null, found ? res.path : null);

    let html;
    if (tt < T0) html = `<div class="line dim">jev: [${START}]</div>`;
    else if (inFlight && inFlight.type === 'jev-first') html = `<div class="line"><span class="dot"></span>jev first · is ${GOAL} reachable? <span class="dim">${Math.round(tt - inFlight.begin)} ms</span></div>`;
    else if (inFlight) {
      html = `<div class="line"><span class="dot"></span>jev: next of [${inFlight.before.join(', ')}]? <span class="dim">${Math.round(tt - inFlight.begin)} ms</span></div>`;
      if (lastVisit) html += `<div class="line dim">last → ${lastVisit.picked} · ${lastVisit.confidence.toFixed(2)} · give_up ${(lastVisit.probabilities?.give_up ?? 0).toFixed(2)}</div>`;
    } else if (finished) {
      html = found
        ? `<div class="line done">path found · ${arrows(res.path)}</div><div class="line dim">jev never picked give_up. this time.</div>`
        : res.reason === 'jev said no'
          ? `<div class="line done">no path · jev said no</div><div class="line dim">0 nodes visited. 1 request. fastest way to not find something.</div>`
          : `<div class="line done">no path · ${res.reason}</div><div class="line dim">${visited.size} nodes visited for nothing.</div>`;
    } else {
      const last = completed[completed.length - 1];
      html = last.type === 'jev-first'
        ? `<div class="line">jev first: reachable ${bar(last.noul)} ${last.noul.toFixed(2)} <span class="dim">${last.noul >= 0.5 ? 'ok, searching' : 'no.'}</span></div>`
        : `<div class="line">→ <b>${last.picked}</b> ${bar(last.confidence)} ${last.confidence.toFixed(2)} <span class="dim">give_up ${(last.probabilities?.give_up ?? 0).toFixed(2)}</span></div>`;
    }
    u.status.innerHTML = html;
    const calls = completed.length + (inFlight ? 1 : 0);
    const tokens = completed.reduce((s, e) => s + e.tokens, 0) + (inFlight ? inFlight.tokens : 0);
    tally(u, visited.size, tt < T0 ? '—' : fmtMs(Math.min(tt - T0, ev.done - T0)), fmtUsd(finished ? res.estimatedCostUsd : tokens * USD_PER_TOKEN), calls);
  }

  function renderStar(a, t) {
    const u = ui[a.key];
    const ev = a.events, res = a.result;
    const tt = Math.min(t, ev.done);
    const completed = ev.filter(e => e.end <= tt);
    const inFlight = ev.find(e => e.begin <= tt && tt < e.end);
    const expands = completed.filter(e => e.type === 'expand');
    const lastExpand = expands[expands.length - 1];
    const closed = new Set(expands.map(e => e.node));
    const hs = {};
    for (const e of completed) if (e.type === 'heuristic') hs[e.node] = e.h;
    const open = new Set(lastExpand ? lastExpand.open.map(o => o.node) : []);
    for (const e of completed) if (e.type === 'heuristic' && (!lastExpand || e.begin >= lastExpand.end) && !closed.has(e.node)) open.add(e.node);
    if (!lastExpand && !closed.size) open.add(START);
    const finished = tt >= ev.done;
    const found = finished && res.reason === 'found';
    paint(u, closed, open, lastExpand ? lastExpand.node : null, found ? res.path : null, hs);

    let html;
    if (tt < T0) html = `<div class="line dim">open: [${START}]</div>`;
    else if (inFlight && inFlight.type === 'heuristic') {
      html = `<div class="line"><span class="dot"></span>jev: h(${inFlight.node})? <span class="dim">${Math.round(tt - inFlight.begin)} ms</span></div>`;
      if (lastExpand) html += `<div class="line dim">open: [${lastExpand.open.map(o => `${o.node} f${o.f.toFixed(1)}`).join(', ')}]</div>`;
    } else if (inFlight) {
      html = `<div class="line">expand <b>${inFlight.node}</b> · g ${inFlight.g} + h ${inFlight.h.toFixed(1)}</div><div class="line dim">open: [${inFlight.open.map(o => `${o.node} f${o.f.toFixed(1)}`).join(', ')}]</div>`;
    } else if (finished) {
      html = found
        ? `<div class="line done">path found · ${arrows(res.path)}</div><div class="line dim">heuristic: ${res.jevCalls} HTTP requests. admissible? ask jev.</div>`
        : `<div class="line done">no path · ${res.reason}</div>`;
    } else {
      const last = completed[completed.length - 1];
      html = last.type === 'heuristic'
        ? `<div class="line">h(${last.node}) = <b>${last.h.toFixed(2)}</b> ${bar(last.confidence)} ${last.confidence.toFixed(2)}</div>`
        : `<div class="line">expand <b>${last.node}</b></div>`;
    }
    u.status.innerHTML = html;
    const jevDone = completed.filter(e => e.type === 'heuristic');
    const calls = jevDone.length + (inFlight && inFlight.type === 'heuristic' ? 1 : 0);
    const jevMs = jevDone.reduce((s, e) => s + e.ms, 0) + (inFlight && inFlight.type === 'heuristic' ? tt - inFlight.begin : 0);
    const tokens = jevDone.reduce((s, e) => s + e.tokens, 0) + (inFlight && inFlight.type === 'heuristic' ? inFlight.tokens : 0);
    tally(u, closed.size, tt < T0 ? '—' : fmtMs(finished ? res.elapsedMs : jevMs), fmtUsd(finished ? res.estimatedCostUsd : tokens * USD_PER_TOKEN), calls);
  }

  function render(t) {
    renderClassic(ALGOS[0], t);
    renderClassic(ALGOS[1], t);
    renderJfs(ALGOS[2], t);
    renderStar(ALGOS[3], t);
  }
  window.__render = render;
  window.__LOOP__ = LOOP;

  const wrap = document.getElementById('wrap'), stage = document.getElementById('stage');
  function fit() {
    if (document.body.classList.contains('frame')) { stage.style.transform = ''; wrap.style.height = "676px"; return; }
    const s = Math.min(1, wrap.clientWidth / 1200);
    stage.style.transform = `scale(${s})`;
    wrap.style.height = `${676 * s}px`;
  }
  window.addEventListener('resize', fit);
  fit();

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (FRAME_T !== null) { render(FRAME_T); return; }
  if (reduced) { render(LOOP - 1); return; }

  let origin = performance.now();
  function tick(now) { render((now - origin) % LOOP); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
  document.getElementById('replay').addEventListener('click', () => { origin = performance.now(); });
})();
</script>
