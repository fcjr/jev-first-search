<title>Jev-First Search Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Spline+Sans+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #f2f5f8;
    --dot: #c9d5e0;
    --ink: #14243a;
    --muted: #5b6b7c;
    --line: #aebccb;
    --card: #ffffff;
    --hl: #ffe66d;
    --s-bfs: #2a78d6;
    --s-jfs: #eb6834;
    --s-dfs: #1baf7a;
    --s-star: #eda100;
    color-scheme: light;
  }
  body { background: var(--ground); color: var(--ink); font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; padding-block: 32px; padding-inline: 16px; margin: 0; font-variant-numeric: tabular-nums; }
  body.frame { padding: 0; overflow: hidden; }
  .page { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .frame .page { max-width: none; gap: 0; }
  .frame .lede, .frame .caption { display: none; }
  .lede { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  h1 { font-size: 40px; font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; margin: 0; max-width: 22ch; text-wrap: balance; font-variation-settings: "opsz" 96; }
  .caption, .intro { color: var(--muted); max-width: 64ch; line-height: 1.5; margin: 0; font-size: 15px; }
  .caption code, .intro code { font-family: "Spline Sans Mono", ui-monospace, monospace; font-size: .9em; background: var(--card); padding: 1px 6px; border: 1px solid var(--dot); border-radius: 4px; }
  button { font: 600 14px "Bricolage Grotesque", sans-serif; color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button:hover { background: var(--hl); }
  button:focus-visible { outline: 3px solid var(--s-bfs); outline-offset: 2px; }
  :root { --bg: #171a1f; --bar: #262a31; --fg: #e9e6dd; --dim: #8b8a80; --amber: #f2b544; --red: #e06c5c; --blue: #7cb5e0; }
  .wrap { width: 100%; min-width: 0; overflow: hidden; }
  .term {
    width: 1200px; height: 676px; transform-origin: top left; box-sizing: border-box;
    background: var(--bg); color: var(--fg); border-radius: 12px; overflow: hidden;
    display: grid; grid-template-rows: 40px 1fr;
    box-shadow: 0 30px 60px -20px rgba(20, 36, 58, .35);
    font: 400 16.5px/26px "Spline Sans Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .frame .term { border-radius: 0; box-shadow: none; }
  .frame body, body.frame { background: var(--bg); }
  .titlebar { background: var(--bar); display: flex; align-items: center; padding: 0 16px; gap: 8px; color: var(--dim); font-size: 13px; font-family: "Bricolage Grotesque", sans-serif; }
  .titlebar .dots { display: flex; gap: 7px; margin-right: 12px; }
  .titlebar .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .titlebar .dots i:nth-child(1) { background: #e06c5c; } .titlebar .dots i:nth-child(2) { background: #f2b544; } .titlebar .dots i:nth-child(3) { background: #7bc47f; }
  .titlebar .title { flex: 1; text-align: center; margin-right: 60px; }
  .screen { padding: 14px 24px; overflow: hidden; white-space: pre; }
  .l { height: 26px; }
  .p { color: var(--amber); }
  .d { color: var(--dim); }
  .r { color: var(--red); }
  .b { color: var(--blue); }
  .y { color: var(--amber); }
  .bold { font-weight: 600; color: #fff; }
  .cur { display: inline-block; width: 10px; height: 20px; background: var(--fg); vertical-align: -3px; }
  @media (prefers-reduced-motion: reduce) { .cur { display: none; } }
</style>

      <div class="screen" id="screen"></div>
    </div>
  </div>
  <p class="caption" id="caption"></p>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const FRAME_T = params.has('t') ? Number(params.get('t')) : null;
  if (params.has('frame')) document.body.classList.add('frame');

  const T = JSON.parse(document.getElementById('traces').textContent || '{}');
  const screen = document.getElementById('screen');
  if (!T.terminal) {
    screen.innerHTML = '<div class="l"><span class="p">$</span> <span class="d">no traces recorded yet. run: npm run media:record</span></div>';
    return;
  }
  document.getElementById('caption').innerHTML =
    `Three runs of the CLI on <code>examples/office.json</code>. Every step is one request to <code>${T.model ?? 'jev-latest'}</code>, and the wait you see is how long it took. ` +
    (T.mock ? 'These answers are from the mock client, not the API.' : `The answers, confidences and latencies are real, recorded ${new Date(T.recordedAt).toLocaleDateString()}.`);

  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const bar = (p) => { const n = Math.round(Math.max(0, Math.min(1, p)) * 10); return `<span class="b">${'█'.repeat(n)}</span><span class="d">${'░'.repeat(10 - n)}</span>`; };
  const ms = (n) => `${Math.round(n)}ms`.padStart(6);
  const pad = (s, n) => s + ' '.repeat(Math.max(0, n - s.length));

  const firstLine = (s) =>
    `  <span class="y">jev first</span>  reachable? ${bar(s.noul)} ${s.noul.toFixed(2)}  ${ms(s.ms)}  ${s.noul >= 0.5 ? '<span class="d">ok, searching</span>' : '<span class="r">no. not searching.</span>'}`;
  const stepLine = (i, s) => {
    const f = pad(`[${s.frontier.join(', ')}]`, 42);
    const p = s.picked === 'give_up' ? `<span class="r">${pad(s.picked, 12)}</span>` : `<span class="bold">${pad(s.picked, 12)}</span>`;
    return `  step ${String(i).padStart(2)}    ${esc(f)} → ${p} ${bar(s.confidence)} ${s.confidence.toFixed(2)}  ${ms(s.ms)}`;
  };
  const totals = (r) => `  ${r.jevCalls} jev call${r.jevCalls === 1 ? '' : 's'} · ${Math.round(r.elapsedMs)} ms · <span class="y">$${r.estimatedCostUsd.toFixed(7)}</span>`;
  const remark = (r) => {
    if (r.reason === 'found') return `# ${r.jevCalls} http requests to walk to the ${r.path[r.path.length - 1]}.`;
    if (r.reason === 'jev said no') return '# 0 nodes visited. fastest way to not find something.';
    if (r.reason === 'jev gave up') return '# it was offered give_up. it took it.';
    if (r.reason === 'frontier exhausted') return '# jev visited everything. none of it was the goal.';
    return `# ${r.reason}`;
  };

  // Script items: cmd (typed), line (instant), wait (spinner for ms, then a line), pause.
  const CHAR_MS = 42, AFTER_CMD = 420, LINE_GAP = 70;
  const S = [];
  for (const run of T.terminal) {
    const r = run.result;
    S.push({ type:'cmd', text:`npx jev-first-search ${run.args.join(' ')}` });
    S.push({ type:'line', html:`jev-first-search  ${esc(run.args[1])} → ${esc(run.args[2])}` });
    let n = 0;
    for (const s of r.steps) {
      if (s.type === 'jev-first') S.push({ type:'wait', ms:s.ms, label:`is ${run.args[2]} reachable?`, then: firstLine(s) });
      else S.push({ type:'wait', ms:s.ms, label:`which of [${s.frontier.join(', ')}] next?`, then: stepLine(++n, s) });
    }
    S.push({ type:'line', html:'' });
    S.push({ type:'line', html: r.path ? `  path: <span class="y">${esc(r.path.join(' → '))}</span>  <span class="d">(probably: ${(r.probability ?? 0).toFixed(2)})</span>` : `  <span class="r">no path (${esc(r.reason)})</span>` });
    S.push({ type:'line', html: totals(r) });
    S.push({ type:'pause', ms:1100 });
    S.push({ type:'cmd', text: remark(r), comment:true });
    S.push({ type:'pause', ms:1600 });
  }
  S[S.length - 1].ms = 3200;

  let t = 0;
  for (const it of S) {
    it.start = t;
    if (it.type === 'cmd') t += it.text.length * CHAR_MS + AFTER_CMD;
    else if (it.type === 'line') t += LINE_GAP;
    else if (it.type === 'wait') t += it.ms + LINE_GAP;
    else t += it.ms;
    it.end = t;
  }
  const LOOP = t;
  const SPIN = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
  const MAX_LINES = 23;

  function render(t) {
    const lines = [];
    let promptOpen = false;
    for (const it of S) {
      if (it.start > t) break;
      const active = t < it.end;
      if (it.type === 'cmd') {
        if (lines.length) lines.push('');
        const n = active ? Math.min(it.text.length, Math.floor((t - it.start) / CHAR_MS)) : it.text.length;
        const typed = esc(it.text.slice(0, n));
        lines.push(`<span class="p">$</span> ${it.comment ? `<span class="d">${typed}</span>` : typed}${active ? '<span class="cur"></span>' : ''}`);
        promptOpen = false;
      } else if (it.type === 'line') {
        lines.push(it.html);
      } else if (it.type === 'wait') {
        if (t < it.start + it.ms) {
          const el = t - it.start;
          lines.push(`  <span class="d">${SPIN[Math.floor(el / 80) % SPIN.length]} asking jev · ${esc(it.label)} · ${Math.round(el)} ms</span>`);
        } else {
          lines.push(it.then);
        }
      } else if (it.type === 'pause' && active) {
        promptOpen = true;
      }
    }
    if (promptOpen) { lines.push(''); lines.push('<span class="p">$</span> <span class="cur"></span>'); }
    screen.innerHTML = lines.slice(-MAX_LINES).map(l => `<div class="l">${l}</div>`).join('');
  }
  window.__render = render;
  window.__LOOP__ = LOOP;

  const wrap = document.getElementById('wrap'), term = document.getElementById('term');
  function fit() {
    if (document.body.classList.contains('frame')) { term.style.transform = ''; wrap.style.height = "676px"; return; }
    if (!wrap.clientWidth) return;
    const s = Math.min(1, wrap.clientWidth / 1200);
    term.style.transform = `scale(${s})`;
    wrap.style.height = `${676 * s}px`;
  }
  window.addEventListener('resize', fit);
  fit();

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (FRAME_T !== null) { render(FRAME_T); return; }
  if (reduced) { render(LOOP - 1); return; }

  let origin = performance.now();
  let lastW = wrap.clientWidth;
  function tick(now) { if (wrap.clientWidth !== lastW) { lastW = wrap.clientWidth; fit(); } render((now - origin) % LOOP); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
  document.getElementById('replay').addEventListener('click', () => { origin = performance.now(); });
})();
</script>
